[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reconsi"
dynamic = ["version"]
description = "An open-source data reconciliation and comparison toolkit for analysts and data engineers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Yash Jindal" }]
keywords = ["reconciliation", "data-comparison", "data-quality", "diff", "analytics", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
duckdb = ["duckdb>=1.1", "pyarrow>=15"]
report = ["matplotlib>=3.8"]
all = ["pyarrow>=15", "duckdb>=1.1", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff==0.16.10",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
    "pyarrow>=15",
    "duckdb>=1.1",
    "matplotlib>=3.8",
]

[project.scripts]
reconsi = "reconsi.cli.main:main"

[project.urls]
Homepage = "https://github.com/Yashjindal11/reconsi"
Documentation = "https://github.com/Yashjindal11/reconsi/tree/main/docs"
Issues = "https://github.com/Yashjindal11/reconsi/issues"
Changelog = "https://github.com/Yashjindal11/reconsi/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/reconsi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reconsi"]

[tool.hatch.build.targets.sdist]
include = ["src/reconsi", "tests", "docs", "configs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "NPY", "PD002"]
ignore = [
    "E501",   # line length is handled by ruff format
    "S101",   # assert is fine in tests and for internal invariants
    "S311",   # random is used for reproducible synthetic data, not cryptography
    "RUF012", # ClassVar annotations on pydantic models are noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]
"benchmarks/**" = ["S"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reconsi"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "pyarrow.*", "matplotlib.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that exercise several subsystems end to end",
    "slow: large-data tests (deselect with -m 'not slow')",
]
filterwarnings = ["error::FutureWarning:reconsi.*"]

[tool.coverage.run]
source = ["reconsi"]
branch = true
