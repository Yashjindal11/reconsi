name: Feature request
description: Suggest a reconciliation capability, diagnosis or report improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The reconciliation problem
      description: What were you trying to find out, and what did ReconSI not tell you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? For diagnoses, say what evidence would support it.
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project principles
      options:
        - label: Works locally, without LLMs, API keys or network access
        - label: Does not change data silently
