name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit, integration, CLI, backend, report and docs tests
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Examples
        run: python scripts/run_examples.py

  research-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ground-truth evaluation (quick)
        run: python benchmarks/evaluate.py --quick
      - name: Research experiments (quick)
        run: python benchmarks/experiments.py --quick
      - name: Scale benchmark (quick)
        run: python benchmarks/bench_scale.py --quick

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel in a clean environment and smoke test
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/reconsi --version
          printf 'id,v\n1,10\n2,20\n' > /tmp/a.csv
          printf 'id,v\n1,10\n2,21\n' > /tmp/b.csv
          /tmp/wheel-env/bin/reconsi compare /tmp/a.csv /tmp/b.csv --keys id --fail-on never --no-report
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
